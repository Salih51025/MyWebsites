<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0f14; color:#e6edf3; font-family:Arial,sans-serif; }
    .box { text-align:center; padding:32px; max-width:560px; }
    h1 { margin:0 0 8px; font-size:56px; letter-spacing:2px; }
    p { margin:0 0 20px; color:#9fb0c0; line-height:1.6; }
    a { color:#0b0f14; background:#7fd3ff; text-decoration:none; padding:10px 16px; border-radius:8px; font-weight:600; }
    a:hover { filter:brightness(1.05); }
  </style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <p>The page you are looking for could not be found.</p>
    <a href="/screens/home/home.html">Go Home</a>
  </main>
</body>
</html>
