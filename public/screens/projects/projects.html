<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title data-i18n-title="title.projects">Projects | Salih</title>

<!-- =====================================================
     NAVBAR CSS
     ===================================================== -->

<link
    rel="stylesheet"
    href="../navbar/styles/01-container-logo.css"
>
<link
    rel="stylesheet"
    href="../navbar/styles/02-links-hamburger.css"
>
<link
    rel="stylesheet"
    href="../navbar/styles/03-responsive.css"
>
<link
    rel="stylesheet"
    href="../navbar/styles/04-reduced-motion.css"
>

<!-- =====================================================
     PROJECTS CSS
     ===================================================== -->

<link
    rel="stylesheet"
    href="../projects/styles/01-page-and-cards.css"
>
<link
    rel="stylesheet"
    href="../projects/styles/02-intro-header-description.css"
>
<link
    rel="stylesheet"
    href="../projects/styles/03-lightbox.css"
>

</head>
<body>
<!-- =====================================================
     NAVBAR
     ===================================================== -->

<div id="nav-placeholder"></div>

<!-- =====================================================
     PROJECTS PAGE
     ===================================================== -->

<main class="projects-page">

    <section
        id="projects"
        class="projects-section"
    >

        <!-- =================================================
             PAGE INTRO
             ================================================= -->

        <div class="projects-intro">

            <span class="projects-label" data-i18n="projects.label">
                MY WORK
            </span>

            <h1 data-i18n="projects.title">
                Projects
            </h1>

            <p data-i18n="projects.intro">
                A selection of projects I've developed
                using modern technologies and creative
                problem-solving.
            </p>

        </div>

        <div id="projects-list" class="projects-list" aria-live="polite"></div>

    </section>

</main>
<!-- =====================================================
     IMAGE LIGHTBOX
     ===================================================== -->

<div
    class="image-lightbox"
    id="image-lightbox"
    aria-hidden="true"
>

    <!-- CLOSE -->

    <button
        class="lightbox-close"
        id="lightbox-close"
        type="button"
        aria-label="Close image viewer"
        data-i18n-aria-label="lightbox.close"
    >
        &times;
    </button>


    <!-- PREVIOUS -->

    <button
        class="lightbox-arrow lightbox-prev"
        id="lightbox-prev"
        type="button"
        aria-label="Previous image"
        data-i18n-aria-label="lightbox.prev"
    >
        &#10094;
    </button>


    <!-- IMAGE AREA -->

    <div class="lightbox-content">

        <img
            id="lightbox-image"
            alt=""
        >

        <div
            class="lightbox-counter"
            id="lightbox-counter"
        >
            1 / 1
        </div>

    </div>


    <!-- NEXT -->

    <button
        class="lightbox-arrow lightbox-next"
        id="lightbox-next"
        type="button"
        aria-label="Next image"
        data-i18n-aria-label="lightbox.next"
    >
        &#10095;
    </button>

</div>


<!-- =====================================================
     NAVBAR JAVASCRIPT
     ===================================================== -->

<script src="../../lang.js"></script>
<script src="../navbar/nav.init.js"></script>
<script src="../navbar/nav.loader.js"></script>


<!-- =====================================================
     PROJECTS DATA RENDERER & LIGHTBOX
     ===================================================== -->

<script src="../projects/scripts/projects-renderer.js"></script>
<script src="../projects/scripts/projects-lightbox-controller.js"></script>


</body>
</html>
