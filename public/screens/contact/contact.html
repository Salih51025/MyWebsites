<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Salih</title>
    <link rel="stylesheet" href="../contact/contact.css">
    <link rel="stylesheet" href="../navbar/styles/01-container-logo.css">
    <link rel="stylesheet" href="../navbar/styles/02-links-hamburger.css">
    <link rel="stylesheet" href="../navbar/styles/03-responsive.css">
    <link rel="stylesheet" href="../navbar/styles/04-reduced-motion.css">
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script src="../../script.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>



  <div class="contact-container">
    <div id="contact">
        <span class="contact-hud-line" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--tl" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--tr" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--bl" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--br" aria-hidden="true"></span>
        <div class="contact-header">
            <span class="contact-label">COMMUNICATION CHANNEL</span>
            <h2>Contact</h2>
            <p class="contact-subtitle">Send a message to initiate contact.</p>
        </div>
        <form id="contact-form">
            <input type="text" id="fullName" placeholder="Full Name" required />
            <input type="email" id="email_id" placeholder="Email" required />
            <textarea id="message" placeholder="Message" required></textarea>
            <p id="form-status" class="form-status" aria-live="polite"></p>
            <button type="submit">Send</button>
        </form>
    </div>
  </div>

<script src="../navbar/nav.init.js"></script>
<script src="../navbar/nav.loader.js"></script>
<script>
    (function () {
        const form = document.getElementById("contact-form");
        const emailInput = document.getElementById("email_id");
        const status = document.getElementById("form-status");
        if (!form || !emailInput || !status) return;

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

            if (!emailPattern.test(email)) {
                status.textContent = "Lütfen geçerli bir e-posta adresi girin.";
                status.className = "form-status error";
                emailInput.focus();
                return;
            }

            status.textContent = "Mesaj gönderiliyor...";
            status.className = "form-status pending";

            if (typeof SendMail === "function") {
                SendMail();
            } else {
                status.textContent = "Gönderim şu anda başlatılamadı.";
                status.className = "form-status error";
            }
        });
    })();
</script>

</body>
</html>
