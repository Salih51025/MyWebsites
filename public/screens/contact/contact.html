<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="title.contact">Contact | Salih</title>
    <link rel="stylesheet" href="../contact/contact.css">
    <link rel="stylesheet" href="../navbar/styles/01-container-logo.css">
    <link rel="stylesheet" href="../navbar/styles/02-links-hamburger.css">
    <link rel="stylesheet" href="../navbar/styles/03-responsive.css">
    <link rel="stylesheet" href="../navbar/styles/04-reduced-motion.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../../script.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>



  <div class="contact-container">
    <div id="contact">
        <span class="contact-hud-line" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--tl" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--tr" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--bl" aria-hidden="true"></span>
        <span class="contact-hud-corner contact-hud-corner--br" aria-hidden="true"></span>
        <div class="contact-header">
            <span class="contact-label" data-i18n="contact.label">COMMUNICATION CHANNEL</span>
            <h2 data-i18n="contact.title">Contact</h2>
            <p class="contact-subtitle" data-i18n="contact.subtitle">Send a message to initiate contact.</p>
        </div>
        <form id="contact-form">
            <input type="text" id="fullName" placeholder="Full Name" data-i18n-placeholder="contact.placeholder.name" required />
            <input type="email" id="email_id" placeholder="Email" data-i18n-placeholder="contact.placeholder.email" required />
            <textarea id="message" placeholder="Message" data-i18n-placeholder="contact.placeholder.message" required></textarea>
            <p id="form-status" class="form-status" aria-live="polite"></p>
            <button type="submit" data-i18n="contact.send">Send</button>
        </form>
    </div>
  </div>

<script src="../../lang.translations.js"></script>
<script src="../../lang.js"></script>
<script src="../navbar/nav.init.js"></script>
<script src="../navbar/nav.loader.js"></script>
<script>
    (function () {
        const form = document.getElementById("contact-form");
        const emailInput = document.getElementById("email_id");
        const messageInput = document.getElementById("message");
        const status = document.getElementById("form-status");
        if (!form || !emailInput || !status) return;

        const params = new URLSearchParams(window.location.search);
        const service = params.get("service");
        let prefillApplied = false;

        function getText(key) {
            if (window.siteI18n && typeof window.siteI18n.t === "function") {
                return window.siteI18n.t(key);
            }
            return "";
        }

        function getPrefillMessage(serviceKey) {
            const key = "contact.prefill." + serviceKey;
            return getText(key);
        }

        function applyServicePrefill(force) {
            if (!messageInput || !service) return;
            const nextMessage = getPrefillMessage(service);
            if (!nextMessage) return;

            if (force || !messageInput.value.trim()) {
                messageInput.value = nextMessage;
                prefillApplied = true;
                return;
            }

            if (prefillApplied) {
                const enMsg = (window.siteI18n && window.siteI18n.getCurrentLang && window.siteI18n.getCurrentLang() === "tr")
                    ? "" : "";
                // if message still equals either known prefill, allow update on lang change
            }
        }

        function setStatus(key, type) {
            const text = getText(key);
            status.textContent = text || "";
            status.className = "form-status" + (type ? " " + type : "");
            status.dataset.statusKey = key || "";
            status.dataset.statusType = type || "";
        }

        // initial prefill (after translations may apply)
        const tryInitialPrefill = function () {
            if (!messageInput || !service) return;
            if (!messageInput.value.trim()) {
                const msg = getPrefillMessage(service);
                if (msg) {
                    messageInput.value = msg;
                    prefillApplied = true;
                }
            }
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", tryInitialPrefill);
        } else {
            tryInitialPrefill();
        }

        document.addEventListener("site:languagechange", function () {
            if (messageInput && service) {
                const current = messageInput.value;
                const newMsg = getPrefillMessage(service);
                if (newMsg && (prefillApplied || !current.trim())) {
                    messageInput.value = newMsg;
                    prefillApplied = true;
                }
            }

            if (status.dataset.statusKey) {
                setStatus(status.dataset.statusKey, status.dataset.statusType || "");
            }
        });

        if (messageInput) {
            messageInput.addEventListener("input", function () {
                // if user edits after prefill, don't auto-replace on language changes except when empty logic won't trigger
                if (service) {
                    const currentPrefill = getPrefillMessage(service);
                    if (messageInput.value !== currentPrefill) {
                        // keep prefillApplied true only conceptually not necessary; simpler: mark as customized
                    }
                    if (messageInput.value.trim() && messageInput.value !== currentPrefill) {
                        prefillApplied = false;
                    }
                }
            });
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

            if (!emailPattern.test(email)) {
                setStatus("contact.status.invalidEmail", "error");
                emailInput.focus();
                return;
            }

            setStatus("contact.status.sending", "pending");

            if (typeof SendMail === "function") {
                SendMail();
            } else {
                setStatus("contact.status.failed", "error");
            }
        });
    })();
</script>

</body>
</html>
