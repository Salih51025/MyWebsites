<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="index.css">
   <script>
    let isLeaving = false;

    function goToHome() {

        // Eğer yönlendirme zaten başladıysa tekrar çalıştırma
        if (isLeaving) return;

        isLeaving = true;

        // Çıkış animasyonunu başlat
        document.body.classList.add("fade-out");

        // Animasyon tamamlandıktan sonra home sayfasına git
        setTimeout(function () {
            window.location.href = "screens/home/home.html";
        }, 550);
    }


    // Kullanıcı herhangi bir yere tıklarsa
    document.addEventListener("click", goToHome, { once: true });


    // Kullanıcı hiçbir yere basmazsa 7 saniye sonra otomatik geç
    setTimeout(function () {
        goToHome();
    }, 8000);
</script>
</head>
