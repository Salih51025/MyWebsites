<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="styles/index/01-reset-base.css">
    <link rel="stylesheet" href="styles/index/02-hero-content.css">
    <link rel="stylesheet" href="styles/index/03-bubbles-hint-transitions.css">
    <link rel="stylesheet" href="styles/index/04-responsive-motion.css">
   <script>
    let isLeaving = false;

    function goToHome() {

        // Eğer yönlendirme zaten başladıysa tekrar çalıştırma
        if (isLeaving) return;

        isLeaving = true;

        // Çıkış animasyonunu başlat
        document.body.classList.add("fade-out");

        // Animasyon tamamlandıktan sonra home sayfasına git
        setTimeout(function () {
            window.location.href = "screens/home/home.html";
        }, 550);
    }


    // Kullanıcı herhangi bir yere tıklarsa
    document.addEventListener("click", goToHome, { once: true });


    // Kullanıcı hiçbir yere basmazsa 7 saniye sonra otomatik geç
    setTimeout(function () {
        goToHome();
    }, 8000);
</script>
</head>
<body>
    <div class="hero">
        <div class="hud-grid" aria-hidden="true"></div>
        <div class="hud-vignette" aria-hidden="true"></div>
        <div class="hud-ring hud-ring--outer" aria-hidden="true"></div>
        <div class="hud-ring hud-ring--inner" aria-hidden="true"></div>
        <div class="hud-arc hud-arc--left" aria-hidden="true"></div>
        <div class="hud-arc hud-arc--right" aria-hidden="true"></div>
        <div class="hud-scan" aria-hidden="true"></div>
        <div class="hud-corners" aria-hidden="true">
            <span class="hud-corner hud-corner--tl"></span>
            <span class="hud-corner hud-corner--tr"></span>
            <span class="hud-corner hud-corner--bl"></span>
            <span class="hud-corner hud-corner--br"></span>
        </div>
        <div class="hud-status hud-status--left" aria-hidden="true">
            <span>SYS: ONLINE</span>
        </div>
        <div class="hud-status hud-status--right" aria-hidden="true">
            <span>PORTFOLIO NODE</span>
            <span>ACCESS: READY</span>
        </div>

        <div class="content">
            <span class="content-label">SYSTEM INTERFACE</span>
            <h1>WELCOME</h1>
            <p>TO MY WEBSITE</p>
        </div>

        <div class="enter-hint">
            <span>Tap to initialize</span>
        </div>

        <div class="bubbles" aria-hidden="true">
            <img src="images/bubble.png" alt="">
            <img src="images/bubble.png" alt="">
            <img src="images/bubble.png" alt="">
            <img src="images/bubble.png" alt="">
            <img src="images/bubble.png" alt="">
            <img src="images/bubble.png" alt="">
            <img src="images/bubble.png" alt="">
        </div>
    </div>
</body>
</html>
